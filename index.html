<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shou Cheng Chen - Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #F9F7F1;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .ink-drop {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            filter: blur(3px);
            opacity: 0.9;
            animation: ink-spread 3s ease-out forwards;
            mix-blend-mode: multiply;
        }

        @keyframes ink-spread {
            0% {
                transform: scale(0) translate(0, 0);
                opacity: 0.9;
                filter: blur(1px);
            }
            20% {
                transform: scale(1.5) translate(0, 0);
                opacity: 0.7;
                filter: blur(2px);
            }
            50% {
                transform: scale(4) translate(0, 0);
                opacity: 0.4;
                filter: blur(4px);
            }
            100% {
                transform: scale(7) translate(0, 0);
                opacity: 0;
                filter: blur(8px);
            }
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 20px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            animation: fadeIn 0.6s ease-in;
            position: relative;
            z-index: 2;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: -1px;
            text-align: center;
        }

        .pdf-container {
            width: 100%;
            height: calc(100vh - 120px);
            min-height: 600px;
            border: none;
            border-radius: 10px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .canva-link {
            margin-top: 30px;
            text-align: center;
        }

        .canva-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .canva-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const body = document.body;
            const container = document.querySelector('.container');
            let lastInkTime = 0;
            const inkThrottle = 300; // milliseconds between ink drops
            
            // Warm, muted ink colors that work with powder snow background
            const inkColors = [
                { r: 180, g: 170, b: 150 }, // Warm beige
                { r: 190, g: 175, b: 160 }, // Soft tan
                { r: 170, g: 160, b: 145 }, // Muted brown
                { r: 185, g: 170, b: 155 }, // Warm gray-beige
                { r: 175, g: 165, b: 150 }, // Dusty beige
                { r: 195, g: 180, b: 165 }, // Light warm brown
                { r: 165, g: 155, b: 140 }, // Muted taupe
                { r: 188, g: 172, b: 158 }  // Soft terracotta-beige
            ];
            
            body.addEventListener('mousemove', function(e) {
                // Check if mouse is over the background (not over container or its children)
                const isOverContainer = container.contains(e.target);
                
                if (!isOverContainer) {
                    const now = Date.now();
                    if (now - lastInkTime > inkThrottle) {
                        createInkDrop(e);
                        lastInkTime = now;
                    }
                }
            });

            function getRandomInkColor() {
                const color = inkColors[Math.floor(Math.random() * inkColors.length)];
                return color;
            }

            function createInkDrop(e) {
                const inkDrop = document.createElement('div');
                inkDrop.classList.add('ink-drop');
                
                // Random ink color
                const color = getRandomInkColor();
                const size = 50 + Math.random() * 40; // Random size between 50-90px
                
                // Create organic ink-like gradient with denser center
                const gradient = `radial-gradient(circle, 
                    rgba(${color.r}, ${color.g}, ${color.b}, 0.8) 0%,
                    rgba(${color.r}, ${color.g}, ${color.b}, 0.6) 15%,
                    rgba(${color.r}, ${color.g}, ${color.b}, 0.4) 30%,
                    rgba(${color.r + 15}, ${color.g + 15}, ${color.b + 15}, 0.25) 50%,
                    rgba(${color.r + 25}, ${color.g + 25}, ${color.b + 25}, 0.1) 70%,
                    rgba(${color.r + 35}, ${color.g + 35}, ${color.b + 35}, 0) 100%
                )`;
                
                inkDrop.style.background = gradient;
                inkDrop.style.width = size + 'px';
                inkDrop.style.height = size + 'px';
                inkDrop.style.left = (e.clientX - size / 2) + 'px';
                inkDrop.style.top = (e.clientY - size / 2) + 'px';
                
                // Add slight random rotation and slight position variation for organic feel
                const rotation = (Math.random() - 0.5) * 20;
                inkDrop.style.transform = `rotate(${rotation}deg)`;
                
                body.appendChild(inkDrop);
                
                // Remove ink drop after animation
                setTimeout(() => {
                    if (inkDrop.parentNode) {
                        inkDrop.remove();
                    }
                }, 3000);
            }
        });
    </script>
</head>
<body>
    <div class="container">
        <h1>Shoucheng Chen - Portfolio</h1>
        <div class="pdf-container">
            <iframe src="Ultimate Edition.pdf#toolbar=1" type="application/pdf">
                <p>Your browser does not support PDFs. <a href="Ultimate Edition.pdf" target="_blank">Download the PDF</a> instead.</p>
            </iframe>
        </div>
        <div class="canva-link">
            <a href="https://www.canva.com/design/DAF7epft3To/nFUpoIn2_V9UcYtrIkIINQ/edit?utm_content=DAF7epft3To&utm_campaign=designshare&utm_medium=link2&utm_source=sharebutton" target="_blank">
                For Extra Work Click Here
            </a>
        </div>
    </div>
</body>
</html>
